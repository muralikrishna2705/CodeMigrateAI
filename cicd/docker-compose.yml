# =============================================================================
# CodeMigrateAI — Docker Compose
# MTech Final Year Project
#
# ARCHITECTURE:
#   Gemini  →  default LLM provider, reached over the internet; the key comes
#              from the repo-root .env via the backend's env_file below
#   Ollama  →  optional local fallback (LLM_PROVIDER=ollama), runs on the
#              Windows host, reached via host.docker.internal:11434
#   Backend →  Docker container, FastAPI + the LangGraph agent pipeline
#   Frontend → Docker container, served by Nginx on port 3000
#   Redis   →  Cache layer for migration results
#   Validator -> Optional syntax validation service
#
# HOW TO RUN (first time or after any code change):
#   docker compose -f cicd/docker-compose.yml down --remove-orphans
#   docker compose -f cicd/docker-compose.yml up --build
#
# HOW TO RUN (subsequent runs, no code changes):
#   docker compose -f cicd/docker-compose.yml up
#
# OPEN IN BROWSER:
#   http://localhost:3000
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # REDIS — Cache layer for migration results
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: codemigrateai-redis
    # No host port mapping: only the backend talks to Redis, and it does so over
    # the internal Docker network (redis://redis:6379/0). Not exposing 6379 to
    # the host avoids the cross-protocol probes Redis was logging as attacks.
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

  # ---------------------------------------------------------------------------
  # BACKEND — FastAPI + AI Agent Pipeline
  # LLM: Gemini via the google_genai provider by default. Set LLM_PROVIDER=ollama
  # in the root .env to fall back to local inference on the Windows host.
  # ---------------------------------------------------------------------------
  backend:
    build:
      context:    ../backend
      dockerfile: Dockerfile
    container_name: codemigrateai-backend
    ports:
      - "8000:8000"
    # The image has no .env baked in (it is git-ignored and must never be), so
    # secrets reach the container through the host's root .env. Compose reads
    # this at *up* time on the host; the file is never copied into the image.
    # Values under `environment:` win over it, which is what keeps the
    # container-network URLs below authoritative regardless of local settings.
    # `required: false` because .env is git-ignored: a fresh clone has none, and
    # the default (required) would fail `compose up` outright instead of letting
    # the app start and report the missing key through /health.
    env_file:
      - path: ../.env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - VALIDATOR_URL=http://validator:8000
      - ENABLE_VALIDATION=true
      # Absolute, and pointed at the mounted data volume. The defaults are
      # "memory/*.db", which resolve_data_path anchors to /app/memory — that is
      # the Python package directory, and mounting a volume over it would shadow
      # the package's own source (and then keep serving a stale snapshot of it
      # after every rebuild, because Docker seeds a new named volume from the
      # image). Keeping the data out of the source tree avoids the whole class
      # of problem; resolve_data_path honours absolute paths as given.
      - MEMORY_DB_PATH=/app/data/codemigrate.db
      - CHECKPOINT_DB_PATH=/app/data/checkpoints.db
    # Everything the backend cannot cheaply rebuild lives on a volume. Without
    # these the RAG index and both SQLite databases sat in the container's
    # writable layer and died on every rebuild — which meant re-embedding the
    # whole corpus, and therefore re-spending the embedding quota, on each boot.
    # Chunk ids are content hashes (rag/vector_store.content_id), so a surviving
    # index makes re-ingestion a no-op instead of a duplicate copy.
    #
    # The fetched-docs cache under /app/rag/reference deliberately is NOT
    # mounted: a volume there would shadow the built-in corpus baked into the
    # image, and re-fetching is plain HTTP that costs no quota. Unchanged docs
    # hash to ids the index already holds and are skipped before any embed call.
    volumes:
      - chroma_index:/app/rag/chroma_db
      - backend_data:/app/data
    extra_hosts:
      # This resolves host.docker.internal → your Windows machine IP
      # so the container can reach Ollama running on Windows
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - validator
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # NOTE: there is no chromadb service. The backend uses Chroma's *embedded*
  # persistent client (see rag/vector_store.py: PERSIST_DIR), so a standalone
  # Chroma server had nothing connecting to it. If you ever move to client/server
  # Chroma, add the service back and point VectorStore at it — and note that the
  # image persists to /data, not /chroma/chroma, and that its /api/v1 heartbeat
  # endpoint was removed in Chroma 1.x.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # VALIDATOR - optional language syntax validation service
  # ---------------------------------------------------------------------------
  validator:
    build:
      context:    ../validator_service
      dockerfile: Dockerfile
    container_name: codemigrateai-validator
    ports:
      - "8001:8000"
    environment:
      - VALIDATOR_TIMEOUT=30
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # FRONTEND — React app built by Vite, served by Nginx
  # Talks to backend at http://localhost:8000
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context:    ../frontend
      dockerfile: Dockerfile
      args:
        # Baked into the JS bundle at build time
        # Must be reachable from the browser (not from inside Docker)
        VITE_API_URL: "http://localhost:8000"
    container_name: codemigrateai-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
  # The reference index. Expensive to rebuild — every chunk in it was paid for
  # in embedding-API quota.
  chroma_index:
  # SQLite: persistent migration memory + LangGraph checkpoints.
  backend_data:
